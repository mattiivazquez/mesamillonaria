<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mesa Millonaria</title>
<style>
  :root {
    --grok: #16a34a;
    --chatgpt: #0891b2;
    --claude: #a21caf;
    --mod: #d97706;
    --bg: #0f1115;
    --panel: #171a21;
    --burbuja: #20242e;
    --texto: #e7e9ee;
    --texto-tenue: #9aa0ac;
    --borde: #2a2f3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 720px; margin: 0 auto; }

  header {
    padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--borde);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { font-size: 12px; color: var(--texto-tenue); }
  header button {
    background: none; border: 1px solid var(--borde); color: var(--texto-tenue);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  header button:active { background: var(--burbuja); }

  #mensajes {
    flex: 1; overflow-y: auto; padding: 14px 12px 8px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .burbuja {
    max-width: 88%; padding: 10px 13px; border-radius: 14px;
    background: var(--burbuja); border-left: 3px solid var(--borde);
    white-space: pre-wrap; word-wrap: break-word; font-size: 14.5px; line-height: 1.42;
  }
  .autor { font-size: 12px; font-weight: 700; margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
  .burbuja.grok { border-left-color: var(--grok); }
  .burbuja.grok .autor { color: var(--grok); }
  .burbuja.chatgpt { border-left-color: var(--chatgpt); }
  .burbuja.chatgpt .autor { color: var(--chatgpt); }
  .burbuja.claude { border-left-color: var(--claude); }
  .burbuja.claude .autor { color: var(--claude); }
  .burbuja.moderador {
    align-self: flex-end; background: #24314a; border-left: none; border-right: 3px solid var(--mod);
  }
  .burbuja.moderador .autor { color: var(--mod); justify-content: flex-end; }
  .burbuja.sistema {
    align-self: center; background: transparent; border: 1px dashed var(--borde);
    color: var(--texto-tenue); font-size: 12.5px; text-align: center;
  }
  .burbuja.error { border-left-color: #dc2626; }
  .burbuja.error .autor { color: #dc2626; }
  .burbuja.cierre { border: 1px solid; }
  .burbuja.orden { border: 2px dashed; }

  .escribiendo { opacity: 0.6; font-style: italic; }

  #plan-actions {
    display: none; gap: 8px; padding: 6px 12px 0; flex-wrap: wrap;
  }
  #plan-actions.visible { display: flex; }
  #plan-actions button {
    flex: 1; min-width: 140px; padding: 10px; border-radius: 10px; border: none;
    background: #2563eb; color: white; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  #plan-actions button.secundario { background: #374151; }
  #plan-actions button:disabled { opacity: 0.5; }

  #barra {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid var(--borde);
  }
  #texto {
    flex: 1; resize: none; border-radius: 20px; border: 1px solid var(--borde);
    background: var(--burbuja); color: var(--texto); padding: 10px 14px; font-size: 15px;
    max-height: 100px;
  }
  #enviar {
    border: none; background: var(--mod); color: #1a1200; font-weight: 700;
    border-radius: 20px; padding: 0 18px; font-size: 14px; cursor: pointer;
  }
  #enviar:disabled { opacity: 0.5; }
  #pausa {
    border: 1px solid var(--borde); background: var(--burbuja); color: var(--texto);
    border-radius: 50%; width: 40px; min-width: 40px; font-size: 16px; cursor: pointer;
  }
  #pausa.oculto { display: none; }
  #estado-linea {
    text-align: center; font-size: 11.5px; color: var(--texto-tenue); padding: 2px 0 0;
  }
  .copiar {
    margin-top: 6px; font-size: 11px; color: var(--texto-tenue); cursor: pointer; text-decoration: underline;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>🎤 Mesa Millonaria</h1>
      <div class="sub" id="tema-actual">Grok · ChatGPT · Claude</div>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <button onclick="nuevoChat()">+ Nuevo</button>
      <a href="/logout" style="color:var(--texto-tenue); font-size:12px;">Salir</a>
    </div>
  </header>

  <div id="mensajes"></div>

  <div id="plan-actions">
    <button id="btn-orden" class="secundario" onclick="darOrden()">🫡 Dame la orden de trabajo</button>
    <button id="btn-cerrar" onclick="cerrarPlan()">🔒 Cerrar y sacar conclusión</button>
    <button id="btn-ejecutar" class="secundario" onclick="ejecutarPlan()" disabled>⚙️ Desarrollar contenido</button>
  </div>

  <div id="estado-linea"></div>
  <div id="barra">
    <button id="pausa" onclick="alternarPausa()" class="oculto">⏸</button>
    <textarea id="texto" rows="1" placeholder="Escribí algo..."></textarea>
    <button id="enviar" onclick="enviar()">Enviar</button>
  </div>
</div>

<script>
const ORDEN = ["Grok", "ChatGPT", "Claude"];
let activo = false;       // el loop automático debería seguir corriendo
let corriendoLoop = false; // guarda contra loops duplicados
let cerrando = false;      // una acción puntual (cerrar/ejecutar/nuevo) está en curso
let planCerrado = false;
let arrancado = false;     // ya se mandó el primer mensaje

const $mensajes = document.getElementById("mensajes");
const $texto = document.getElementById("texto");
const $enviar = document.getElementById("enviar");
const $pausa = document.getElementById("pausa");
const $estadoLinea = document.getElementById("estado-linea");
const $planActions = document.getElementById("plan-actions");
const $btnEjecutar = document.getElementById("btn-ejecutar");
const $temaActual = document.getElementById("tema-actual");

const espera = (ms) => new Promise((res) => setTimeout(res, ms));

function clasePorAutor(autor) {
  if (autor === "Grok") return "grok";
  if (autor === "ChatGPT") return "chatgpt";
  if (autor === "Claude") return "claude";
  if (autor === "Moderador") return "moderador";
  if (autor === "Sistema") return "sistema";
  return "";
}

function iconoPorAutor(autor) {
  return { Grok: "👽", ChatGPT: "🧠", Claude: "🦉", Moderador: "🎤", Sistema: "ℹ️" }[autor] || "";
}

function agregarBurbuja(autor, texto, extraClase) {
  const div = document.createElement("div");
  div.className = "burbuja " + clasePorAutor(autor) + (extraClase ? " " + extraClase : "");
  const nombreLinea = document.createElement("div");
  nombreLinea.className = "autor";
  nombreLinea.textContent = iconoPorAutor(autor) + " " + autor;
  div.appendChild(nombreLinea);
  const cuerpo = document.createElement("div");
  cuerpo.textContent = texto;
  div.appendChild(cuerpo);
  $mensajes.appendChild(div);
  $mensajes.scrollTop = $mensajes.scrollHeight;
  return div;
}

function agregarBloqueLargo(autor, texto) {
  const div = agregarBurbuja(autor, texto);
  const link = document.createElement("div");
  link.className = "copiar";
  link.textContent = "Copiar";
  link.onclick = () => {
    navigator.clipboard.writeText(texto);
    link.textContent = "¡Copiado!";
    setTimeout(() => (link.textContent = "Copiar"), 1200);
  };
  div.appendChild(link);
}

// Muestra los archivos REALES que generaron (CSV, HTML, PDF, etc.) con un
// link de descarga directa - funciona igual desde el celu que desde la compu.
function agregarBurbujaArchivos(archivos) {
  if (!archivos || !archivos.length) return;
  const div = document.createElement("div");
  div.className = "burbuja sistema";
  const titulo = document.createElement("div");
  titulo.className = "autor";
  titulo.textContent = "📁 Archivos reales generados";
  div.appendChild(titulo);
  for (const a of archivos) {
    const fila = document.createElement("div");
    const link = document.createElement("a");
    link.href = "/api/archivo?ruta=" + encodeURIComponent(a.ruta);
    link.textContent = "⬇️ " + a.nombre;
    link.style.color = "inherit";
    fila.appendChild(link);
    div.appendChild(fila);
  }
  $mensajes.appendChild(div);
  $mensajes.scrollTop = $mensajes.scrollHeight;
}

async function api(ruta, body) {
  const r = await fetch(ruta, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "Error desconocido");
  return data;
}

function setLineaEstado(mensaje) {
  $estadoLinea.textContent = mensaje || "";
}

function actualizarBotonPausa() {
  $pausa.classList.toggle("oculto", !arrancado || cerrando);
  $pausa.textContent = activo ? "⏸" : "▶️";
  $pausa.title = activo ? "Pausar" : "Seguir";
}

function alternarPausa() {
  activo = !activo;
  actualizarBotonPausa();
  if (activo) iniciarLoopSiHaceFalta();
  else setLineaEstado("En pausa. Escribí algo o apretá ▶️ para seguir.");
}

// El loop corre solo, llamando a /api/siguiente en cadena, hasta que lo pausen
// o se cierre la charla. Mientras corre, el usuario puede seguir escribiendo:
// su mensaje se suma al historial y el próximo en hablar ya lo tiene en cuenta.
async function iniciarLoopSiHaceFalta() {
  if (corriendoLoop) return;
  corriendoLoop = true;
  while (activo && !planCerrado) {
    setLineaEstado("pensando...");
    try {
      const r = await api("/api/siguiente", {});
      agregarBurbuja(r.autor, r.texto);
      $planActions.classList.add("visible");
    } catch (e) {
      agregarBurbuja("Sistema", "Error: " + e.message, "error");
      activo = false;
      actualizarBotonPausa();
      break;
    }
    await espera(500); // pausa chica entre turnos, para que se pueda leer
  }
  corriendoLoop = false;
  if (!planCerrado) setLineaEstado("En pausa. Escribí algo o apretá ▶️ para seguir.");
}

async function enviar() {
  const texto = $texto.value.trim();
  if (!texto || planCerrado) return;
  $texto.value = "";
  agregarBurbuja("Moderador", texto);
  try {
    await api("/api/mensaje", { texto });
  } catch (e) {
    agregarBurbuja("Sistema", "Error: " + e.message, "error");
    return;
  }
  arrancado = true;
  activo = true;
  actualizarBotonPausa();
  iniciarLoopSiHaceFalta();
}

async function darOrden() {
  if (cerrando || planCerrado) return;
  activo = false; // pausa el loop mientras arman la orden, para no mezclar mensajes
  cerrando = true;
  actualizarBotonPausa();
  setLineaEstado("armando la orden de trabajo para vos...");
  try {
    const r = await api("/api/orden", {});
    for (const it of r.instrucciones) {
      agregarBurbuja(it.autor, it.texto, "orden");
    }
    agregarBurbuja("Sistema", "Orden de trabajo guardada en: " + r.archivo);
    agregarBurbujaArchivos(r.archivos_generados);
  } catch (e) {
    agregarBurbuja("Sistema", "Error: " + e.message, "error");
  }
  cerrando = false;
  actualizarBotonPausa();
  setLineaEstado("En pausa. Escribí algo o apretá ▶️ para seguir.");
}

async function cerrarPlan() {
  if (cerrando || planCerrado) return;
  activo = false; // pausa el loop automático antes de cerrar
  cerrando = true;
  actualizarBotonPausa();
  document.getElementById("btn-cerrar").disabled = true;
  setLineaEstado("cerrando la charla y sacando la conclusión...");
  try {
    const r = await api("/api/cerrar", {});
    for (const c of r.compromisos) {
      agregarBurbuja(c.autor, c.texto, "cierre");
    }
    agregarBurbuja("Sistema", "Guardado en: " + r.archivo);
    planCerrado = true;
    $btnEjecutar.disabled = false;
  } catch (e) {
    agregarBurbuja("Sistema", "Error: " + e.message, "error");
    document.getElementById("btn-cerrar").disabled = false;
  }
  cerrando = false;
  actualizarBotonPausa();
  setLineaEstado("");
}

async function ejecutarPlan() {
  if (cerrando) return;
  cerrando = true;
  setLineaEstado("los 3 están escribiendo el contenido real (puede tardar unos minutos)...");
  try {
    const r = await api("/api/ejecutar", {});
    agregarBurbuja("Sistema", "Contenido real generado. Guardado en: " + r.carpeta);
    for (const nombre of ORDEN) {
      if (r.resultado[nombre]) {
        agregarBloqueLargo(nombre, r.resultado[nombre]);
      }
    }
    agregarBurbujaArchivos(r.archivos_generados);
  } catch (e) {
    agregarBurbuja("Sistema", "Error: " + e.message, "error");
  }
  cerrando = false;
  setLineaEstado("");
}

async function nuevoChat() {
  if (!confirm("¿Arrancar un chat nuevo? Se pierde lo que se está viendo (queda guardado igual si ya cerraste la charla).")) return;
  activo = false;
  await api("/api/nuevo", {});
  $mensajes.innerHTML = "";
  $planActions.classList.remove("visible");
  $btnEjecutar.disabled = true;
  document.getElementById("btn-cerrar").disabled = false;
  planCerrado = false;
  arrancado = false;
  cerrando = false;
  actualizarBotonPausa();
  setLineaEstado("");
  agregarBurbuja("Sistema", "Chat nuevo. Contale a Grok, ChatGPT y Claude de qué querés que hablen.");
}

$texto.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    enviar();
  }
});

// Al cargar, si ya había una conversación en curso (recargaste la página), la recupera.
(async function cargarEstadoInicial() {
  try {
    const r = await fetch("/api/estado").then((x) => x.json());
    if (r.usuario) $temaActual.textContent = "Conectado como " + r.usuario;
    if (r.mensajes && r.mensajes.length) {
      for (const m of r.mensajes) agregarBurbuja(m.autor, m.texto, m.cierre ? "cierre" : "");
      arrancado = true;
      if (r.cerrado) {
        planCerrado = true;
        $planActions.classList.add("visible");
        $btnEjecutar.disabled = false;
        document.getElementById("btn-cerrar").disabled = true;
      } else {
        $planActions.classList.add("visible");
        setLineaEstado("En pausa. Escribí algo o apretá ▶️ para seguir.");
      }
      actualizarBotonPausa();
    } else {
      agregarBurbuja("Sistema", "Contale a Grok, ChatGPT y Claude de qué querés que hablen.");
    }
  } catch (e) {
    agregarBurbuja("Sistema", "No pude conectar con el servidor.", "error");
  }
})();
</script>
</body>
</html>
